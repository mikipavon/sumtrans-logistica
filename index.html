<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <meta name="description" content="Plataforma de gestión logística de Sumtrans: control de envíos, rutas, conductores y clientes en tiempo real." />
    <meta name="author" content="Miguel Ángel Pavón Maíz" />
    <link rel="icon" type="image/jpeg" href="/logo-sum.jpg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SumTrans" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <!-- viewport-fit=cover: activa env(safe-area-inset-*) para que los modales a
         pantalla completa respeten el notch y la barra de gestos del iPhone -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Sumtrans Logística</title>
  </head>
  <body style="overscroll-behavior:none">
    <div id="root"></div>
    <script>
      // Pull-to-refresh prevention for Android PWA.
      // PRIMARY: CSS overscroll-behavior:none (on body and in index.css) handles this.
      // FALLBACK: Minimal JS only for edge-case Android WebViews that ignore CSS.
      // CRITICAL: We must NOT use {passive:false} on document-level touchmove,
      // because Chrome Android blocks ALL native scrolling while waiting for
      // non-passive touchmove handlers to execute.
      (function() {
        var lastTouchY = 0;
        var maybePrevent = false;
        document.addEventListener('touchstart', function(e) {
          lastTouchY = e.touches[0].pageY;
          // Only flag for prevention if we're exactly at the top
          maybePrevent = (window.scrollY <= 0 || document.documentElement.scrollTop <= 0);
        }, { passive: true });
        // Only attach non-passive listener to the BODY element (not document)
        // and only preventDefault in the very specific pull-to-refresh scenario
        document.body.addEventListener('touchmove', function(e) {
          if (!maybePrevent) return;
          var y = e.touches[0].pageY;
          var scrollTop = window.scrollY || document.documentElement.scrollTop || 0;
          // Only block if truly at top AND pulling down AND the event is cancelable
          if (scrollTop <= 0 && y > lastTouchY + 5 && e.cancelable) {
            e.preventDefault();
          } else {
            // Once we've started scrolling, stop trying to prevent
            maybePrevent = false;
          }
        }, { passive: false });
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
