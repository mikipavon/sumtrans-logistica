/* persistence.js - Módulo de persistencia para OneDrive (v1.0) */

const DB_NAME = "TSB_Data_Sync";
const STORE_NAME = "FileHandles";
const KEY_NAME = "main_handle";

// Inicializa IndexedDB para guardar el "handle" del archivo
async function getDB() {
    return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, 1);
        request.onupgradeneeded = () => {
            if (!request.result.objectStoreNames.contains(STORE_NAME)) {
                request.result.createObjectStore(STORE_NAME);
            }
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
    });
}

// Guarda el handle en IndexedDB
async function saveHandleInDB(handle) {
    if (handle.name === "persistence.js" || handle.name === "calculadora_fusion.html") {
        alert("❌ ERROR CRÍTICO: No puedes usar archivos del programa para guardar datos. Por favor, selecciona o crea un archivo nuevo como 'datos.json'.");
        return;
    }
    const db = await getDB();
    const tx = db.transaction(STORE_NAME, "readwrite");
    tx.objectStore(STORE_NAME).put(handle, KEY_NAME);
    return new Promise((resolve) => (tx.oncomplete = resolve));
}

// Recupera el handle de IndexedDB
async function getHandleFromDB() {
    const db = await getDB();
    const tx = db.transaction(STORE_NAME, "readonly");
    const store = tx.objectStore(STORE_NAME);
    return new Promise((resolve) => {
        const req = store.get(KEY_NAME);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => resolve(null);
    });
}

// Verifica si tenemos permiso de escritura
async function verifyPermission(fileHandle, readWrite) {
    const options = {};
    if (readWrite) {
        options.mode = "readwrite";
    }
    if ((await fileHandle.queryPermission(options)) === "granted") {
        return true;
    }
    try {
        if ((await fileHandle.requestPermission(options)) === "granted") {
            return true;
        }
    } catch (e) {
        console.warn("Petición de permiso denegada.");
    }
    return false;
}

// Objeto global de persistencia
window.TSB_Sync = {
    handle: null,
    status: "offline",
    suggestedPath: null,

    async connect() {
        try {
            // Si ya tenemos un handle, intentamos pedir permiso directamente
            if (this.handle) {
                if (await verifyPermission(this.handle, true)) {
                    this.status = "synced";
                    const data = await this.read();
                    if (data && this.onDataLoaded) this.onDataLoaded(data);
                    if (this.onStatusChange) this.onStatusChange(this.status);
                    return true;
                }
            }

            const pickerOptions = {
                types: [{
                    description: "Archivo de datos TSB (JSON)",
                    accept: { "application/json": [".json"] }
                }],
                multiple: false
            };

            if (this.suggestedPath) {
                const fileName = this.suggestedPath.split('\\').pop().split('/').pop();
                pickerOptions.suggestedName = fileName;
            }

            const [handle] = await window.showOpenFilePicker(pickerOptions);
            
            if (handle.name === "persistence.js" || handle.name === "calculadora_fusion.html") {
                alert("❌ ¡ALTO! Has seleccionado un archivo del programa. Debes seleccionar un archivo de DATOS (ej: datos_tarifas.json).");
                return false;
            }

            this.handle = handle;
            await saveHandleInDB(handle);
            return await this.init();
        } catch (e) {
            console.error("Error al conectar:", e);
            return false;
        }
    },

    async init() {
        // Intentar cargar configuración predefinida (para instalaciones)
        try {
            const configResp = await fetch('config.json');
            if (configResp.ok) {
                const config = await configResp.json();
                if (config.dataPath) {
                    this.suggestedPath = config.dataPath;
                    console.log("Ruta sugerida detectada:", this.suggestedPath);
                }
            }
        } catch (e) {
            // Ignorar si no hay config.json
        }

        const savedHandle = await getHandleFromDB();
        if (savedHandle) {
            this.handle = savedHandle;
            const options = { mode: "readwrite" };
            let currentPerm = await this.handle.queryPermission(options);
            
            if (currentPerm === "granted") {
                this.status = "synced";
                const data = await this.read();
                if (data && this.onDataLoaded) this.onDataLoaded(data);
            } else {
                this.status = "needs_permission";
            }
        } else {
            this.status = "offline";
        }
        
        if (this.onStatusChange) this.onStatusChange(this.status);
        return this.status === "synced";
    },

    async reconnect() {
        if (!this.handle) return this.connect();
        try {
            if (await verifyPermission(this.handle, true)) {
                this.status = "synced";
                const data = await this.read();
                if (data && this.onDataLoaded) this.onDataLoaded(data);
                if (this.onStatusChange) this.onStatusChange(this.status);
                return true;
            }
        } catch (e) {
            console.error("Error en reconexión:", e);
        }
        return false;
    },

    async read() {
        if (!this.handle) return null;
        try {
            const file = await this.handle.getFile();
            const text = await file.text();
            if (!text.trim()) return {}; 
            return JSON.parse(text);
        } catch (e) {
            console.error("Error al leer archivo:", e);
            return null;
        }
    },

    async save(data) {
        if (!this.handle || this.status !== "synced") return false;
        try {
            const currentData = await this.read() || {};
            const updatedData = { ...currentData, ...data };

            const writable = await this.handle.createWritable();
            await writable.write(JSON.stringify(updatedData, null, 2));
            await writable.close();
            return true;
        } catch (e) {
            console.error("Error al guardar:", e);
            this.status = "needs_permission";
            if (this.onStatusChange) this.onStatusChange(this.status);
            return false;
        }
    },

    onDataLoaded: null, 
    onStatusChange: null
};

        function buildCPmap() {
            const map = {};
            for (const [desde, hasta, baremo, desc] of reglasCP) {
                const a = parseInt(desde, 10);
                const b = parseInt(hasta, 10);
                for (let cp = a; cp <= b; cp++) {
                    map[cp.toString().padStart(5, '0')] = { baremo, desc };
                }
            }
            return map;
        }
        const cpMap = buildCPmap();

            let row = dbFija.find(r => r[0] >= kg);
            if (!row) row = dbFija[dbFija.length - 1];
            return { precio: row[baremo], pesoOrigen: row[0] };
        }

        function getPrecioB9Alta(kg, dbB9) {
            let row = dbB9.find(r => r[0] >= kg);
            if (!row) row = dbB9[dbB9.length - 1];
            return { precio: row[1], tramo: row[0] };
        }

        function getTarifaTonelada(baremo, kg, dbT) {
            let row = dbT.find(r => r[0] >= kg);
            if (!row) row = dbT[dbT.length - 1];
            const val = row[baremo];
            if (val === null) return { precio: 0, tarifa: 0, tramo: row[0], usaFijo: false, err: "Sin tarifa" };
            if (baremo === 9) return { precio: val, tarifa: 0, tramo: row[0], usaFijo: true };
            return { precio: (kg * val) / 1000, tarifa: val, tramo: row[0], usaFijo: false };

            const calculateCost = (agency) => {
                // --- LÓGICA GENERAL DE ZONAS (GLS, ONTIME, Y NUEVAS) ---
                if (agency.zones) {
                    const cp = formData.postalCode?.trim().padStart(5, '0');
                    if (!cp || cp.length !== 5) return null;
                    const baremoEntry = getBaremo(cp);
                    if (!baremoEntry) return null;

                    let zoneName = 'peninsular';
                    if (baremoEntry.baremo === 1) zoneName = 'provincial';
                    else if (baremoEntry.baremo <= 3) zoneName = 'regional';
                    else if (baremoEntry.baremo <= 5) zoneName = 'peninsular';
                    // Si se añade Portugal específicamente en el futuro, se mapearía aquí

                    const zoneData = agency.zones[zoneName] || agency.zones[Object.keys(agency.zones)[0]];
                    if (!zoneData || !zoneData.rates || zoneData.rates.length === 0) return null;

                    const weight = results.chargeableWeight;
                    const insurance = agency.insurance || 0;

                    let basePrice = 0;
                    // Lógica especial para GLS (tramos de 15) vs Ontime (tramos de 50) vs General (máximo tramo)
                    const maxLimit = Math.max(...zoneData.rates.map(r => r.limit));
                    
                    if (weight <= maxLimit) {
                        const bracket = zoneData.rates.find(r => r.limit >= weight);
                        basePrice = bracket ? bracket.price : zoneData.rates[zoneData.rates.length - 1].price;
                    } else {
                        const maxBracket = zoneData.rates.find(r => r.limit === maxLimit);
                        const baseMax = maxBracket ? maxBracket.price : zoneData.rates[zoneData.rates.length - 1].price;
                        basePrice = baseMax + ((weight - maxLimit) * (zoneData.additional || 0));
                    }
                    return basePrice + insurance;
                }

                // --- LOGICA EXCLUSIVA TSB FUSIONADA ---

                    let bracket = agency.rates.find(r => r.limit >= weight);
                    if (!bracket) bracket = agency.rates[agency.rates.length - 1];
                    return bracket.price;
                }
                return (parseFloat(agency.basePrice) || 0) + (results.chargeableWeight * (parseFloat(agency.pricePerKg) || 0));
            };

                            regional:   { rates: [{limit:10, price:7}, {limit:20, price:12}], additional: 0.7 },
                            peninsular: { rates: [{limit:10, price:9}, {limit:20, price:15}], additional: 0.9 }
                        }
                    };
                    delete newAg.rates;
                    delete newAg.basePrice;
                    delete newAg.pricePerKg;
                }
                
                const updated = [...agencies, newAg];
                setAgencies(updated);
                localStorage.setItem('tsb_agencies_fusion', JSON.stringify(updated));
                
                // Sincronizar agencias con OneDrive
                if (window.TSB_Sync && window.TSB_Sync.status === 'synced') {
                    window.TSB_Sync.save({ agencies: updated });
                }

                setSelectedAgencyId(newId);
                setSingleImportText("");
            };

            const handleMoveAgency = (id, direction) => {
                const index = agencies.findIndex(a => a.id === id);
                if (index === -1) return;
                
                const newIndex = direction === 'up' ? index - 1 : index + 1;
                if (newIndex < 0 || newIndex >= agencies.length) return;
                
                const updated = [...agencies];
                const temp = updated[index];
                updated[index] = updated[newIndex];
                updated[newIndex] = temp;
                
                setAgencies(updated);
                localStorage.setItem('tsb_agencies_fusion', JSON.stringify(updated));
            };

            const handleHardResetAgencies = () => {
                if (confirm("⚠️ ESTO BORRARÁ TODAS LAS AGENCIAS IMPORTADAS Y PERSONALIZADAS. ¿Estás seguro?")) {
                    localStorage.removeItem('tsb_agencies_fusion');
                    localStorage.removeItem('tsb_gls_config_fusion');
                    alert("Aplicación reseteada. Recargando...");
                    window.location.reload();
                }
            };

            const handleDeleteAgency = (id) => {
                if (confirm("¿Seguro que quieres borrar esta agencia?")) {
                    const updated = agencies.filter(a => a.id !== id);
                    setAgencies(updated);
                    localStorage.setItem('tsb_agencies_fusion', JSON.stringify(updated));
                    
                    // Sincronizar borrado con OneDrive
                    if (window.TSB_Sync && window.TSB_Sync.status === 'synced') {
                        window.TSB_Sync.save({ agencies: updated });
                    }

                    if (selectedAgencyId === id) setSelectedAgencyId('bulk');
                }
            };

            const handleUpdateAgency = (id, field, value) => {
                const updatedAgencies = agencies.map(a => a.id === id ? { ...a, [field]: value } : a);
                setAgencies(updatedAgencies);
                localStorage.setItem('tsb_agencies_fusion', JSON.stringify(updatedAgencies));
            };

            const handleUpdateZoneRate = (agencyId, zone, index, field, value) => {
                const updatedAgencies = agencies.map(a => {
                    if (a.id === agencyId) {
                        const newZones = { ...a.zones };
                        const newRates = [...newZones[zone].rates];
                        newRates[index] = { ...newRates[index], [field]: parseFloat(value) || 0 };
                        newZones[zone] = { ...newZones[zone], rates: newRates };
                        return { ...a, zones: newZones };
                    }
                    return a;
                });
                setAgencies(updatedAgencies);
                localStorage.setItem('tsb_agencies_fusion', JSON.stringify(updatedAgencies));
            };

            const handleUpdateAdditional = (agencyId, zone, value) => {
                const updatedAgencies = agencies.map(a => {
                    if (a.id === agencyId) {
                        const newZones = { ...a.zones };
                        newZones[zone] = { ...newZones[zone], additional: parseFloat(value) || 0 };
                        return { ...a, zones: newZones };
                    }
                    return a;
                });
                setAgencies(updatedAgencies);
                localStorage.setItem('tsb_agencies_fusion', JSON.stringify(updatedAgencies));
            };

            const handleUpdateInsurance = (agencyId, value) => {
                const updatedAgencies = agencies.map(a => {
                    if (a.id === agencyId) return { ...a, insurance: parseFloat(value) || 0 };
                    return a;
                });
                setAgencies(updatedAgencies);
                localStorage.setItem('tsb_agencies_fusion', JSON.stringify(updatedAgencies));
            };

            const handleUpdateZoneName = (agencyId, oldZone, newZone) => {
                if (!newZone || oldZone === newZone) return;
                const updatedAgencies = agencies.map(a => {
                    if (a.id === agencyId) {
                        const newZones = {};
                        Object.entries(a.zones).forEach(([z, data]) => {
                            if (z === oldZone) newZones[newZone.toLowerCase().trim()] = data;
                            else newZones[z] = data;
                        });
                        return { ...a, zones: newZones };
                    }
                    return a;
                });
                setAgencies(updatedAgencies);
                localStorage.setItem('tsb_agencies_fusion', JSON.stringify(updatedAgencies));
            };

            const handleAddZone = (agencyId) => {
                const zoneName = prompt("Nombre de la nueva zona (ej: baleares):")?.toLowerCase().trim();
                if (!zoneName) return;
                const updatedAgencies = agencies.map(a => {
                    if (a.id === agencyId) {
                        if (a.zones[zoneName]) return a;
                        // Usar los tramos de la primera zona como base
                        const baseZone = Object.keys(a.zones)[0];
                        const baseRates = a.zones[baseZone].rates.map(r => ({ ...r, price: 0 }));
                        return { ...a, zones: { ...a.zones, [zoneName]: { rates: baseRates, additional: 0 } } };
                    }
                    return a;
                });
                setAgencies(updatedAgencies);
                localStorage.setItem('tsb_agencies_fusion', JSON.stringify(updatedAgencies));
            };

            const handleDeleteZone = (agencyId, zone) => {
                if (confirm(`¿Seguro que quieres borrar la zona "${zone}"?`)) {
                    const updatedAgencies = agencies.map(a => {
                        if (a.id === agencyId) {
                            const newZones = { ...a.zones };
                            delete newZones[zone];
                            return { ...a, zones: newZones };
                        }
                        return a;
                    });
                    setAgencies(updatedAgencies);
                    localStorage.setItem('tsb_agencies_fusion', JSON.stringify(updatedAgencies));
                }
            };

            const handleAddWeightBracket = (agencyId) => {
                const limit = parseFloat(prompt("Hasta cuántos kg?")) || 0;
                if (!limit) return;
                const updatedAgencies = agencies.map(a => {
                    if (a.id === agencyId) {
                        const newZones = { ...a.zones };
                        Object.keys(newZones).forEach(z => {
                            newZones[z] = { 
                                ...newZones[z], 
                                rates: [...newZones[z].rates, { limit, price: 0 }].sort((x, y) => x.limit - y.limit)
                            };
                        });
                        return { ...a, zones: newZones };
                    }
                    return a;
                });
                setAgencies(updatedAgencies);
                localStorage.setItem('tsb_agencies_fusion', JSON.stringify(updatedAgencies));
            };

            const handleDeleteWeightBracket = (agencyId, limit) => {
                if (confirm(`¿Cerrar tramo de ${limit}kg en todas las zonas?`)) {
                    const updatedAgencies = agencies.map(a => {
                        if (a.id === agencyId) {
                            const newZones = { ...a.zones };
                            Object.keys(newZones).forEach(z => {
                                newZones[z] = {
                                    ...newZones[z],
                                    rates: newZones[z].rates.filter(r => r.limit !== limit)
                                };
                            });
                            return { ...a, zones: newZones };
                        }
                        return a;
                    });
                    setAgencies(updatedAgencies);
                    localStorage.setItem('tsb_agencies_fusion', JSON.stringify(updatedAgencies));
                }
            };

            const handleSingleImport = (agencyId) => {
                setImportError("");
                if (!singleImportText.trim()) return;
                try {
                    const lines = singleImportText.trim().split('\n');
                    const newRates = [];
                    for (let line of lines) {
                        const parts = line.replace(/,/g, '.').split(/[\t; ]+/);
                        if (parts.length >= 2) {
                            const limit = parseFloat(parts[0]);
                            const price = parseFloat(parts[1]);
                            if (!isNaN(limit) && !isNaN(price)) newRates.push({ limit, price });
                        }
                    }
                    if (newRates.length === 0) throw new Error("No se detectaron datos válidos.");
                    newRates.sort((a, b) => a.limit - b.limit);
                    handleUpdateAgency(agencyId, 'rates', newRates);
                    setSingleImportText("");
                    alert(`¡Importadas ${newRates.length} tarifas correctamente!`);
                } catch (err) { setImportError("Error: " + err.message); }
            };

            const handleBulkImport = () => {
                setImportError("");
                if (!bulkImportText.trim()) { setImportError("Pega los datos primero."); return; }
                try {
                    const lines = bulkImportText.trim().split('\n');
                    if (lines.length < 2) throw new Error("Faltan datos.");
                    const headerParts = lines[0].trim().split(/\t+| {2,}/);
                    
                    // Clonar el array de agencias de forma segura (shallow copy de los objetos que vamos a modificar)
                    let tempAgencies = agencies.map(a => ({...a}));
                    const activeImport = [];

                    for (let i = 1; i < headerParts.length; i++) {
                        const name = headerParts[i].trim();
                        if (!name) continue;
                        let existingIdx = tempAgencies.findIndex(a => a.name.toLowerCase() === name.toLowerCase());
                        
                        if (existingIdx !== -1) {
                            // Resetear rates pero mantener el objeto clonado
                            tempAgencies[existingIdx].rates = [];
                            activeImport.push(tempAgencies[existingIdx]);
                        } else {
                            const newAg = {
                                id: `imp_${Date.now()}_${i}`,
                                name: name,
                                color: "bg-slate-50 border-slate-200 text-slate-600",
                                rates: [], basePrice: 0, pricePerKg: 0
                            };
                            tempAgencies.push(newAg);
                            activeImport.push(newAg);
                        }
                    }

                    for (let i = 1; i < lines.length; i++) {
                        const line = lines[i].trim();
                        if (!line) continue;
                        const parts = line.replace(/,/g, '.').split(/\t+| {2,}/);
                        const limit = parseFloat(parts[0]);
                        if (isNaN(limit)) continue;
                        for (let j = 0; j < activeImport.length; j++) {
                            const priceIdx = j + 1;
                            if (parts[priceIdx]) {
                                const price = parseFloat(parts[priceIdx]);
                                if (!isNaN(price)) activeImport[j].rates.push({ limit, price });
                            }
                        }
                    }
                    
                    tempAgencies.forEach(a => { 
                        if (Array.isArray(a.rates)) {
                            a.rates.sort((x, y) => x.limit - y.limit);
                        }
                    });

                    setAgencies(tempAgencies);
                    localStorage.setItem('tsb_agencies_fusion', JSON.stringify(tempAgencies));
                    setBulkImportText("");
                    alert(`Se han actualizado/añadido ${activeImport.length} agencias.`);
                    if (activeImport.length > 0) setSelectedAgencyId(activeImport[0].id);
                } catch (err) { setImportError("Error procesando masivo: " + err.message); }
            };

                setTimeout(() => {
                    setAnalysisResult("Análisis completado: TSB ofrece el mejor margen comercial en zonas nacionales gracias al Baremo 5 unificado. Ontime es mejor para paquetería ligera < 5kg.");
                    setIsAnalyzing(false);

            const copyToClipboard = () => {
                navigator.clipboard.writeText(aiContent);
                alert("¡Copiado!");
            };

            const parseInputVal = (valStr) => {
                if (valStr === undefined || valStr === null || valStr.toString().trim() === '') return null;
                const num = parseFloat(valStr.toString().replace(',', '.'));
                return isNaN(num) ? null : num;
            };

            const handleUpdateTsbFija = (ri, b, val) => {
                const newData = [...dbFija];
                newData[ri] = [...newData[ri]];
                newData[ri][b] = val;
                setDbFija(newData);

                                    {window.TSB_Sync.suggestedPath && (

                                <button

                                >

                                    <div className="p-6 border-b border-slate-100 flex justify-between items-center">
                                        <div>
                                            <h2 className="text-xl font-bold text-slate-800 flex items-center gap-2">
                                                <History className="w-6 h-6 text-orange-500" />
                                                Mis Presupuestos Guardados
                                            </h2>
                                            <p className="text-sm text-slate-500">Historial de cotizaciones guardadas</p>
                                        </div>
                                        <button onClick={() => setIsQuotesModalOpen(false)} className="p-2 hover:bg-slate-100 rounded-full text-slate-500"><X className="w-5 h-5" /></button>
                                    </div>

                                    <div className="p-6 bg-slate-50 flex-1 overflow-y-auto">
                                        {savedQuotes.length === 0 ? (
                                            <div className="flex flex-col items-center justify-center h-48 text-slate-400">
                                                <History className="w-12 h-12 mb-2 opacity-20" />
                                                <p>No tienes presupuestos guardados aún.</p>
                                            </div>
                                        ) : (
                                            <div className="space-y-3">
                                                {savedQuotes.map(quote => (
                                                    <div key={quote.id} className="bg-white p-4 rounded-lg shadow-sm border border-slate-200 flex flex-col md:flex-row items-center justify-between gap-4">
                                                        <div className="flex items-center gap-4 flex-1">
                                                            <div className="p-3 bg-blue-50 text-blue-600 rounded-full">
                                                                <Package className="w-5 h-5" />
                                                            </div>
                                                            <div>
                                                                <div className="flex items-center gap-2 mb-1">
                                                                    <h4 className="font-bold text-slate-800">{quote.agency}</h4>
                                                                    <span className="text-xs bg-slate-100 text-slate-500 px-2 py-0.5 rounded-full flex items-center gap-1">
                                                                        <Calendar className="w-3 h-3" /> {quote.date}
                                                                    </span>
                                                                </div>
                                                                <div className="flex items-center gap-1.5 font-semibold text-slate-700">
                                                                    <Users className="w-3.5 h-3.5 text-slate-400" /> {quote.client}
                                                                </div>
                                                                <div className="text-sm text-slate-500 mt-1 flex gap-4">
                                                                    <span className="flex items-center gap-1"><MapPin className="w-3 h-3" /> CP: {quote.cp}</span>
                                                                    <span className="flex items-center gap-1"><Scale className="w-3 h-3" /> {quote.weight} kg</span>
                                                                </div>
                                                            </div>
                                                        </div>
                                                        <div className="flex items-center gap-4">
                                                            <div className="text-right">
                                                                <p className="text-xs text-slate-400 uppercase font-semibold">Precio Final</p>
                                                                <p className="text-xl font-bold text-blue-600">{quote.price.toFixed(2)} €</p>
                                                            </div>
                                                            <button
                                                                onClick={() => handleDeleteQuote(quote.id)}
                                                                className="p-2 text-red-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition-colors"
                                                                title="Eliminar"
                                                            >
                                                                <Trash2 className="w-4 h-4" />
                                                            </button>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* MODAL ESTIMADOR DE MEDIDAS (IA) */}
                        {isEstimatorOpen && (
                            <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                                <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md flex flex-col">
                                    <div className="p-4 border-b border-slate-100 flex justify-between items-center">
                                        <h2 className="text-lg font-bold text-slate-800 flex items-center gap-2">
                                            <Wand2 className="w-5 h-5 text-indigo-600" /> Estimar Medidas
                                        </h2>
                                        <button onClick={() => setIsEstimatorOpen(false)} className="p-2 hover:bg-slate-100 rounded-full text-slate-500"><X className="w-5 h-5" /></button>
                                    </div>
                                    <div className="p-6">
                                        <p className="text-sm text-slate-600 mb-3">
                                            Describe qué vas a enviar y la IA calculará el peso y volumen aproximado.
                                        </p>
                                        <textarea
                                            value={estimatorText}
                                            onChange={(e) => setEstimatorText(e.target.value)}
                                            placeholder="Ej: Una caja de 6 botellas de vino, una bicicleta de montaña, un sofá de 3 plazas..."
                                            className="w-full h-32 p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 mb-4 text-sm"
                                        />
                                        <button
                                            onClick={handleEstimateFromDescription}
                                            disabled={isEstimating || !estimatorText.trim()}
                                            className="w-full py-2 bg-indigo-600 text-white rounded-lg font-medium hover:bg-indigo-700 disabled:opacity-50 flex items-center justify-center gap-2"
                                        >
                                            {isEstimating ? <Loader2 className="w-4 h-4 animate-spin" /> : <Sparkles className="w-4 h-4" />}
                                            {isEstimating ? "Calculando..." : "Estimar con IA"}
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* MODAL DETALLE DE BULTOS (MULTI-BULTOS) */}
                        {isPackagesModalOpen && (
                            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-md flex items-center justify-center p-4 z-[60] overflow-y-auto">
                                <div className="bg-white rounded-2xl shadow-2xl w-full max-w-4xl min-h-[500px] flex flex-col my-auto border border-white/20 animate-in fade-in zoom-in duration-300">
                                    <div className="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50 rounded-t-2xl">
                                        <div className="flex items-center gap-3">
                                            <div className="p-2 bg-blue-600 rounded-lg shadow-lg shadow-blue-200">
                                                <Layers className="w-5 h-5 text-white" />
                                            </div>
                                            <div>
                                                <h3 className="font-bold text-slate-800 text-lg">Detalle de Bultos / Multi-Bultos</h3>
                                                <p className="text-xs text-slate-500">Añade cada bulto individual para calcular el total exacto.</p>
                                            </div>
                                        </div>
                                        <button onClick={() => setIsPackagesModalOpen(false)} className="p-2 hover:bg-slate-200 rounded-full transition-colors"><X className="w-5 h-5 text-slate-500" /></button>
                                    </div>

                                    <div className="p-6 flex-1 bg-white">
                                        {(formData.packages || []).length === 0 ? (
                                            <div className="flex flex-col items-center justify-center py-12 text-slate-400 bg-slate-50 rounded-xl border-2 border-dashed border-slate-200">
                                                <Box className="w-16 h-16 mb-4 opacity-10" />
                                                <p className="font-medium text-slate-500">No hay bultos detallados aún</p>
                                                <p className="text-sm">Pulsa en "Añadir Bulto" para empezar.</p>
                                                <button
                                                    onClick={() => {
                                                        const newPack = { id: Date.now(), weight: 1, width: 40, length: 40, height: 40 };
                                                        setFormData(prev => ({ ...prev, packages: [...(prev.packages || []), newPack] }));
                                                    }}
                                                    className="mt-6 flex items-center gap-2 bg-blue-600 text-white px-6 py-2.5 rounded-full font-bold hover:bg-blue-700 transition-all shadow-md active:scale-95"
                                                >
                                                    <Plus className="w-5 h-5" /> Añadir Primer Bulto
                                                </button>
                                            </div>
                                        ) : (
                                            <div className="space-y-4 max-h-[50vh] overflow-y-auto pr-2 custom-scrollbar">
                                                {formData.packages.map((pkg, idx) => (
                                                    <div key={pkg.id} className="group bg-slate-50 hover:bg-white p-4 rounded-xl border border-slate-200 hover:border-blue-300 transition-all shadow-sm hover:shadow-md grid grid-cols-1 sm:grid-cols-12 gap-4 items-end">
                                                        <div className="sm:col-span-1">
                                                            <div className="w-8 h-8 rounded-full bg-slate-200 flex items-center justify-center text-xs font-bold text-slate-500">#{idx + 1}</div>
                                                        </div>
                                                        <div className="sm:col-span-2">
                                                            <label className="block text-[10px] uppercase font-bold text-slate-400 mb-1">Peso (kg)</label>
                                                            <div className="relative">
                                                                <input
                                                                    type="number"
                                                                    value={pkg.weight}
                                                                    onChange={(e) => {
                                                                        const newList = [...formData.packages];
                                                                        newList[idx].weight = e.target.value;
                                                                        setFormData(prev => ({ ...prev, packages: newList }));
                                                                    }}
                                                                    className="w-full p-2 pl-7 border border-slate-300 rounded-lg text-sm font-mono focus:ring-2 focus:ring-blue-500 outline-none"
                                                                />
                                                                <Scale className="w-3.5 h-3.5 absolute left-2 top-2.5 text-slate-400" />
                                                            </div>
                                                        </div>
                                                        <div className="sm:col-span-2">
                                                            <label className="block text-[10px] uppercase font-bold text-slate-400 mb-1 flex items-center gap-1"><Ruler className="w-3 h-3" /> Largo (cm)</label>
                                                            <input
                                                                type="number"
                                                                value={pkg.length}
                                                                onChange={(e) => {
                                                                    const newList = [...formData.packages];
                                                                    newList[idx].length = e.target.value;
                                                                    setFormData(prev => ({ ...prev, packages: newList }));
                                                                }}
                                                                className="w-full p-2 border border-slate-300 rounded-lg text-sm font-mono focus:ring-2 focus:ring-blue-500 outline-none text-center"
                                                            />
                                                        </div>
                                                        <div className="sm:col-span-2">
                                                            <label className="block text-[10px] uppercase font-bold text-slate-400 mb-1">Ancho (cm)</label>
                                                            <input
                                                                type="number"
                                                                value={pkg.width}
                                                                onChange={(e) => {
                                                                    const newList = [...formData.packages];
                                                                    newList[idx].width = e.target.value;
                                                                    setFormData(prev => ({ ...prev, packages: newList }));
                                                                }}
                                                                className="w-full p-2 border border-slate-300 rounded-lg text-sm font-mono focus:ring-2 focus:ring-blue-500 outline-none text-center"
                                                            />
                                                        </div>
                                                        <div className="sm:col-span-2">
                                                            <label className="block text-[10px] uppercase font-bold text-slate-400 mb-1">Alto (cm)</label>
                                                            <input
                                                                type="number"
                                                                value={pkg.height}
                                                                onChange={(e) => {
                                                                    const newList = [...formData.packages];
                                                                    newList[idx].height = e.target.value;
                                                                    setFormData(prev => ({ ...prev, packages: newList }));
                                                                }}
                                                                className="w-full p-2 border border-slate-300 rounded-lg text-sm font-mono focus:ring-2 focus:ring-blue-500 outline-none text-center"
                                                            />
                                                        </div>
                                                        <div className="sm:col-span-2 text-center">
                                                            <div className="text-[10px] uppercase font-bold text-slate-400 mb-1">Subtotal</div>
                                                            <div className="text-xs font-bold text-blue-600 bg-blue-50 py-2 rounded-lg border border-blue-100">
                                                                {((pkg.length * pkg.width * pkg.height) / 1000000).toFixed(3)} m³
                                                            </div>
                                                        </div>
                                                        <div className="sm:col-span-1 flex justify-end">
                                                            <button
                                                                onClick={() => {
                                                                    const newList = formData.packages.filter((_, i) => i !== idx);
                                                                    setFormData(prev => ({ ...prev, packages: newList }));
                                                                }}
                                                                className="p-2 text-red-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition-colors"
                                                            >
                                                                <Trash2 className="w-5 h-5" />
                                                            </button>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        )}

                                        {(formData.packages || []).length > 0 && (
                                            <div className="mt-4 flex justify-start">
                                                <button
                                                    onClick={() => {
                                                        const newPack = { id: Date.now(), weight: 1, width: 40, length: 40, height: 40 };
                                                        setFormData(prev => ({ ...prev, packages: [...(prev.packages || []), newPack] }));
                                                    }}
                                                    className="flex items-center gap-2 text-blue-600 font-bold text-sm bg-blue-50 px-4 py-2 rounded-lg hover:bg-blue-100 border border-blue-200 transition-all"
                                                >
                                                    <Plus className="w-4 h-4" /> Añadir otro bulto
                                                </button>
                                            </div>
                                        )}
                                    </div>

                                    <div className="p-6 border-t border-slate-100 bg-slate-50 rounded-b-2xl">
                                        <div className="flex flex-col md:flex-row justify-between items-center gap-6">
                                            <div className="flex gap-4">
                                                <div className="bg-white p-3 rounded-xl border border-slate-200 shadow-sm flex items-center gap-3">
                                                    <div className="p-2 bg-orange-100 text-orange-600 rounded-lg"><Scale className="w-5 h-5" /></div>
                                                    <div>
                                                        <div className="text-[10px] uppercase font-bold text-slate-400">Peso Total</div>
                                                        <div className="text-lg font-black text-slate-800">{(formData.packages || []).reduce((sum, p) => sum + (parseFloat(p.weight) || 0), 0).toFixed(1)} <span className="text-xs font-normal">kg</span></div>
                                                    </div>
                                                </div>
                                                <div className="bg-white p-3 rounded-xl border border-slate-200 shadow-sm flex items-center gap-3">
                                                    <div className="p-2 bg-indigo-100 text-indigo-600 rounded-lg"><Box className="w-5 h-5" /></div>
                                                    <div>
                                                        <div className="text-[10px] uppercase font-bold text-slate-400">Volumen Total</div>
                                                        <div className="text-lg font-black text-slate-800">{(formData.packages || []).reduce((sum, p) => sum + (((parseFloat(p.width) || 0) * (parseFloat(p.height) || 0) * (parseFloat(p.length) || 0)) / 1000000), 0).toFixed(3)} <span className="text-xs font-normal">m³</span></div>
                                                    </div>
                                                </div>
                                            </div>

                                            <div className="flex gap-3 w-full md:w-auto">
                                                <button
                                                    onClick={() => setIsPackagesModalOpen(false)}
                                                    className="flex-1 md:flex-none px-6 py-3 text-slate-600 font-bold hover:bg-slate-200 rounded-xl transition-all"
                                                >
                                                    Cancelar
                                                </button>
                                                <button
                                                    onClick={() => {
                                                        applyPackages(formData.packages);
                                                        setIsPackagesModalOpen(false);
                                                    }}
                                                    disabled={(formData.packages || []).length === 0}
                                                    className="flex-1 md:flex-none px-10 py-3 bg-blue-600 text-white font-bold rounded-xl shadow-lg shadow-blue-200 hover:bg-blue-700 disabled:opacity-50 transition-all flex items-center justify-center gap-2"
                                                >
                                                    <Save className="w-5 h-5" /> Aplicar a la Cotización
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                        {aiModalOpen && (
                            <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                                <div className="bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[85vh] flex flex-col animate-in fade-in zoom-in duration-200">
                                    <div className="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50 rounded-t-2xl">
                                        <h3 className="font-bold text-slate-800 flex items-center gap-2"><Sparkles className="w-5 h-5 text-purple-600" />{aiTitle}</h3>
                                        <button onClick={() => setAiModalOpen(false)} className="p-1 hover:bg-slate-200 rounded-full"><X className="w-5 h-5 text-slate-500" /></button>
                                    </div>
                                    <div className="p-6 overflow-y-auto flex-1 bg-white">
                                        {aiLoading ? <div className="flex flex-col items-center py-12 gap-3"><Loader2 className="w-10 h-10 animate-spin text-purple-500" /><p className="text-sm font-medium animate-pulse">Pensando...</p></div> : <div className="prose prose-sm text-slate-700 whitespace-pre-wrap">{aiContent}</div>}
                                    </div>
                                    {!aiLoading && !aiError && <div className="p-4 border-t border-slate-100 bg-slate-50 flex justify-end gap-2"><button onClick={copyToClipboard} className="px-4 py-2 text-sm font-medium bg-blue-600 text-white rounded-lg hover:bg-blue-700 flex items-center gap-2"><Copy className="w-4 h-4" /> Copiar</button></div>}
                                </div>
                            </div>
                        )}

                        {isGeoModalOpen && (
                            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-md flex items-center justify-center p-4 z-[120] animate-in fade-in duration-300">
                                <div className="bg-white rounded-3xl shadow-2xl w-full max-w-4xl max-h-[90vh] flex flex-col overflow-hidden border border-slate-200">
                                    {/* Header Modal */}
                                    <div className="p-6 border-b border-slate-100 bg-slate-50 flex flex-col gap-4">
                                        <div className="flex justify-between items-center">
                                            <div>
                                                <h3 className="text-2xl font-black text-slate-800 flex items-center gap-2">
                                                    <MapPin className="w-6 h-6 text-blue-600" /> Buscador de Poblaciones
                                                </h3>
                                                <p className="text-sm text-slate-500 font-medium">Encuentra el código postal por nombre de localidad</p>
                                            </div>
                                            <button 
                                                onClick={() => {
                                                    setIsGeoModalOpen(false);
                                                    setGeoSearchTerm("");
                                                    setSelectedProvince(null);
                                                }} 
                                                className="p-2 hover:bg-slate-200 rounded-full transition-colors"
                                            >
                                                <X className="w-6 h-6 text-slate-400" />
                                            </button>
                                        </div>

                                        {/* Buscador y Filtros */}
                                        <div className="flex flex-col md:flex-row gap-3">
                                            <div className="relative flex-1">
                                                <input 
                                                    type="text" 
                                                    placeholder="Buscar ciudad o pueblo... (ej: Lucena)" 
                                                    className="w-full p-3 pl-12 bg-white border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 shadow-sm transition-all"
                                                    value={geoSearchTerm}
                                                    onChange={(e) => setGeoSearchTerm(e.target.value)}
                                                />
                                                <Search className="w-5 h-5 text-slate-400 absolute left-4 top-3.5" />
                                            </div>
                                            <select 
                                                className="md:w-64 p-3 bg-white border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 shadow-sm"
                                                value={selectedProvince || ""}
                                                onChange={(e) => setSelectedProvince(e.target.value || null)}
                                            >
                                                <option value="">Todas las provincias</option>
                                                {GEOGRAFIA_ESPANA.flatMap(r => r.provincias).map(p => (
                                                    <option key={p.nombre} value={p.nombre}>{p.nombre}</option>
                                                ))}
                                            </select>
                                        </div>
                                    </div>

                                    {/* Lista de Resultados */}
                                    <div className="flex-1 overflow-y-auto p-6 bg-slate-50/30">
                                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                                            {GEOGRAFIA_ESPANA.flatMap(region => 
                                                region.provincias
                                                    .filter(prov => !selectedProvince || prov.nombre === selectedProvince)
                                                    .flatMap(prov => 
                                                        prov.poblaciones
                                                            .filter(pob => 
                                                                !geoSearchTerm || 
                                                                pob.nombre.toLowerCase().includes(geoSearchTerm.toLowerCase()) || 
                                                                pob.cp.includes(geoSearchTerm)
                                                            )
                                                            .map(pob => ({ ...pob, provincia: prov.nombre, region: region.region }))
                                                    )
                                            ).slice(0, 50).map((pob, idx) => (
                                                <button 
                                                    key={`${pob.provincia}-${pob.nombre}-${idx}`}
                                                    onClick={() => {
                                                        setFormData(prev => ({ ...prev, postalCode: pob.cp }));
                                                        setIsGeoModalOpen(false);
                                                        setGeoSearchTerm("");
                                                        setSelectedProvince(null);
                                                    }}
                                                    className="bg-white p-4 rounded-2xl border border-slate-200 hover:border-blue-500 hover:shadow-lg transition-all text-left flex flex-col group"
                                                >
                                                    <div className="flex justify-between items-start mb-1">
                                                        <span className="font-bold text-slate-800 group-hover:text-blue-700 transition-colors uppercase text-sm">{pob.nombre}</span>
                                                        <span className="text-xs font-mono bg-blue-50 text-blue-600 px-2 py-0.5 rounded-md border border-blue-100">{pob.cp}</span>
                                                    </div>
                                                    <span className="text-[10px] text-slate-400 font-bold uppercase tracking-wider">{pob.provincia} ({pob.region})</span>
                                                </button>
                                            ))}
                                        </div>
                                        {GEOGRAFIA_ESPANA.length === 0 && (
                                            <div className="text-center py-12 text-slate-400 flex flex-col items-center gap-3">
                                                <Info className="w-12 h-12" />
                                                <p className="font-medium italic">No se encontraron poblaciones con ese nombre.</p>
                                            </div>
                                        )}
                                    </div>

                                    {/* Footer Legend */}
                                    <div className="p-4 bg-slate-100 border-t border-slate-200 text-center">
                                        <p className="text-[10px] text-slate-400 font-black uppercase tracking-[0.3em]">Base de datos geográfica SUM 2026</p>
                                    </div>
                                </div>
                            </div>
                        )}

                    </div>
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<LogisticsCalculator />);
    </script>
</body>

</html>
